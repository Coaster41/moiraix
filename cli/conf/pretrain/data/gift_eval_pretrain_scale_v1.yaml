# gift_eval_pretrain_scale_v1: the Track C data-SCALE mixture (derived from gift_eval_pretrain_trackb_p30_nosde_gift).
#
# Rationale, and the audit that motivated it, are in the module docstring of
# scripts/gen_scale_v1_config.py. In one line: the 400M run tied the 30M run
# because 80 epochs consumed ~1.34T observations of which only ~50B were
# unique (~27x repetition) -- the cap-based weighting made 82% of the on-disk
# corpus (ERA5+CMIP6) unreachable while recycling a 0.165B split 812 times.
#
# Block shares (sampling share = num_ts*weight / sum):
#   core_real  target 40.0%   achieved 40.0%
#   climate    target 12.0%   achieved 12.0%
#   synth      target 27.0%   achieved 27.0%
#   rmisc      target  8.0%   achieved  8.0%
#   tsmixup    target  8.0%   achieved  8.0%
#   gift       target  5.0%   achieved  5.0%
# Total 6,905,470 effective windows.
# Within core_real/climate/tsmixup/gift the base config's relative weights are
# preserved exactly (one common rescale each). synth is split proportional to
# unique observations; rmisc by num_ts**0.5.
#
# Build the new corpora first: sbatch slurm/scripts/build_synth_scale_v1.sh
# Regenerate: python scripts/gen_scale_v1_config.py --climate 0.12 --rmisc 0.08 --synth 0.27 --tsmixup 0.08 --gift 0.05
# Tests: test/data/test_scale_v1_weights.py
