# gift_eval_pretrain_trackb_p30_nosde_gift + the RMISC corpus (nju-zhangsq/RMISC) at a ~15% sampling share.
#
# RMISC dirs overlapping GIFT-Eval test or the existing pretrain corpus are
# excluded at BUILD time (EXCLUDE in data/builder/lotsa_v1/rmisc.py, pinned by
# test/data/test_rmisc.py); every dataset below is new, non-leaking data.
#
# Weight math: base pool 5,386,586 eff. windows; q=0.15 ->
#   rmisc_eff = 5,386,586*0.15/(1-0.15) = 950,574 windows over
#   106 datasets / 1,947,098 univariate series.
# Split within RMISC: eff_d ~ num_ts_d**0.5 (sqrt flattening, so
#   AzurePublicDatasetV2 cannot swamp the 100+ smaller sources).
# Build first: sbatch slurm/scripts/build_rmisc.sh
# Regenerate:  python scripts/gen_rmisc_config.py --share 0.15 --alpha 0.5

# FIX G variant (HANDOFF_MOIRAI2_PARITY.md): the winning Track B mix
# (p30_nosde, exp-006) PLUS the GIFT-Eval TrainTest TRAIN split at a ~10%
# sampling share. NOT zero-shot on the leaderboard (but non-leaking: series are
# truncated one extra prediction window deeper than the official train
# boundary; see gift_eval_train.py + test_gift_eval_train_split.py).
# Build first: python -m moiraix.data.builder.lotsa_v1.gift_eval_train
# Weight math: existing pool 4,847,917 eff windows; q=0.10 ->
#   g_eff = 4,847,917*0.1/0.9 = 538,657; w = 538,657/97,177 series = 5.5431.
# Rescale: w = 4,847,917*q/(1-q)/97,177.
# Track B retrain mixture (HANDOFF_SYNTH_DATA.md §4): pure-synthetic share p=0.30 (nosde).
# Non-pure-synth base B = R(real 2,770,242) + TSMixup(623,300, weight unchanged) = 3,393,542 eff. windows;
# synth_eff = B*p/(1-p) = 1,454,375, split synth_backbone_v0 50% (w=0.72719), synth_sarima2_v0 15% (w=0.72719), synth_stress_v0 25% (w=0.72719), chronos_kernel_synth_1m 10% (w=0.14544).
# Total 4,847,917 eff. windows; real share 57.1%, tsmixup 12.9%.
# Derived from gift_eval_pretrain_moirai2.yaml; ONLY the kernel_synth weight and
# the appended Track B builders differ. Tests: test_synthetic_weights.py::test_trackb_*
