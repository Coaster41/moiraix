[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moiraix"
dynamic = [
  "version",
]
# Pinned to the versions the existing checkpoints were trained and evaluated
# with (the uni2ts venv); requirements-lock.txt is the full frozen environment.
dependencies = [
  "torch==2.4.1",
  "lightning==2.4.0",
  "gluonts==0.16.2",
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.3.3",
  "pyarrow",
  "einops==0.7.0",
  "jaxtyping==0.2.38",
  "python-dotenv==1.0.0",
  "hydra-core==1.3.0",
  "orjson",
  "tensorboard",
  "wandb",
  "multiprocess",
  "huggingface_hub==0.36.2",
  "safetensors",
  "datasets==2.17.1",
]
requires-python = ">=3.10"
description = "MoiraiX: unified encoder/decoder time-series foundation model (derived from Salesforce uni2ts)"
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["Time Series Forecasting", "Transformer", "Deep Learning", "PyTorch"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest_timeout",
  "black[jupyter]==24.2.0",
  "isort",
  "pre-commit",
]

[tool.hatch.version]
path = "src/moiraix/__about__.py"

[tool.hatch.build]
packages = ["src/moiraix"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
